# Starts only MongoDB for local development:  docker compose up -d
# The API and React app run with npm (see README).
services:
  mongo:
    image: mongo:7
    container_name: smart-city-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
